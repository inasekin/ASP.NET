syntax = "proto3";

option csharp_namespace = "Pcf.GivingToCustomer.WebHost.Grpc";

package customers;

// Сервис для работы с клиентами
service CustomersService {
  // Получить список всех клиентов
  rpc GetCustomers (GetCustomersRequest) returns (GetCustomersResponse);
  
  // Получить клиента по ID
  rpc GetCustomer (GetCustomerRequest) returns (GetCustomerResponse);
  
  // Создать нового клиента
  rpc CreateCustomer (CreateCustomerRequest) returns (CreateCustomerResponse);
  
  // Обновить клиента
  rpc UpdateCustomer (UpdateCustomerRequest) returns (UpdateCustomerResponse);
  
  // Удалить клиента
  rpc DeleteCustomer (DeleteCustomerRequest) returns (DeleteCustomerResponse);
}

// Сообщения запросов
message GetCustomersRequest {
}

message GetCustomerRequest {
  string id = 1;
}

message CreateCustomerRequest {
  string first_name = 1;
  string last_name = 2;
  string email = 3;
  repeated string preference_ids = 4;
}

message UpdateCustomerRequest {
  string id = 1;
  string first_name = 2;
  string last_name = 3;
  string email = 4;
  repeated string preference_ids = 5;
}

message DeleteCustomerRequest {
  string id = 1;
}

// Сообщения ответов
message GetCustomersResponse {
  repeated CustomerShort customers = 1;
}

message GetCustomerResponse {
  Customer customer = 1;
}

message CreateCustomerResponse {
  string id = 1;
}

message UpdateCustomerResponse {
  bool success = 1;
}

message DeleteCustomerResponse {
  bool success = 1;
}

// Типы данных
message CustomerShort {
  string id = 1;
  string first_name = 2;
  string last_name = 3;
  string email = 4;
}

message Customer {
  string id = 1;
  string first_name = 2;
  string last_name = 3;
  string email = 4;
  repeated Preference preferences = 5;
  repeated PromoCode promo_codes = 6;
}

message Preference {
  string id = 1;
  string name = 2;
}

message PromoCode {
  string id = 1;
  string code = 2;
  string begin_date = 3;
  string end_date = 4;
  string partner_id = 5;
  string service_info = 6;
} 